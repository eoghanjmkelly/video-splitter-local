name: Build & Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build:bundle
      - name: Build binary
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then npm run build:pkg:linux; fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then npm run build:pkg:win; fi
          if [ "${{ matrix.os }}" = "macos-latest" ]; then npm run build:pkg:mac; fi
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: releases/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: releases
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
