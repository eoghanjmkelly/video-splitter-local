name: Packaging Sanity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build Video Merger (pack)
        working-directory: video-merger-gui
        run: |
          npm ci
          npm run pack
      - name: Build Video Splitter (pack)
        working-directory: video-splitter-gui
        run: |
          npm ci
          npm run pack
      - name: Checksums
        shell: pwsh
        run: |
          $paths = @("video-merger-gui/dist","video-splitter-gui/dist")
          foreach ($p in $paths) { if (Test-Path $p) { Get-ChildItem -Recurse $p | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content -Path "checksums-windows.txt" -Encoding utf8 -Append }}
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: packaging-sanity-windows
          path: |
            video-merger-gui/dist/**
            video-splitter-gui/dist/**
            checksums-windows.txt
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build Video Merger (dmg)
        working-directory: video-merger-gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run dist:mac
      - name: Build Video Splitter (dmg)
        working-directory: video-splitter-gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run dist:mac
      - name: Checksums
        run: |
          for d in video-merger-gui/dist video-splitter-gui/dist; do
            if [ -d "$d" ]; then (cd "$d" && (shasum -a 256 * || sha256sum *) >> ../../checksums-macos.txt || true); fi
          done
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: packaging-sanity-macos
          path: |
            video-merger-gui/dist/**
            video-splitter-gui/dist/**
            checksums-macos.txt
  linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build Video Merger (linux)
        working-directory: video-merger-gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run dist:linux
      - name: Build Video Splitter (linux)
        working-directory: video-splitter-gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run dist:linux
      - name: Checksums
        run: |
          for d in video-merger-gui/dist video-splitter-gui/dist; do
            if [ -d "$d" ]; then (cd "$d" && (shasum -a 256 * || sha256sum *) >> ../../checksums-linux.txt || true); fi
          done
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: packaging-sanity-linux
          path: |
            video-merger-gui/dist/**
            video-splitter-gui/dist/**
            checksums-linux.txt
