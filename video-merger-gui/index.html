<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Video Merger GUI</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    #progress { margin-top: 1em; }
    .bar { width: 100%; background: #eee; border-radius: 4px; margin-bottom: 0.5em; }
    .bar-inner { height: 18px; background: #4caf50; border-radius: 4px; width: 0; transition: width 0.2s; }
    #outputs { margin-top: 1em; }
    button { margin-top: 1em; }
  </style>
</head>
<body>
  <h2>Video Merger</h2>
  <input type="file" id="mergeInput" multiple accept="video/*">
  <button id="mergeBtn">Merge Selected Videos</button>
  <div id="mergeProgress"></div>
  <div id="outputs"></div>
  <script src="renderer.js"></script>
</body>
</html>
